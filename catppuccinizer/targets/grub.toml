# GRUB target, declared (core.declarative; docs/architecture.md, "Declarative targets").
name = "grub"
help = "recolour a GRUB theme"
description = """GRUB target: recolour a GRUB theme (theme.txt + images).

A GRUB theme is a folder with theme.txt, images and fonts. The colours written
in theme.txt ("#rrggbb" strings) go to Catppuccin roles; the images are
recoloured like the image target (keys for flat art, LUT for photos), the
icons apart (-a icons=ACCENT); fonts and the rest are copied as they are.

--install copies the result to /boot/grub/themes (/boot/grub2/themes on
Fedora and openSUSE), --apply (which installs first) sets GRUB_THEME in
/etc/default/grub and writes the menu again (update-grub, grub-mkconfig or
grub2-mkconfig), --restore puts the previous GRUB_THEME back and removes the
installed themes. --preview
shows the largest image (the background) before and after."""

[source]
marker = "theme.txt"
search = ["/boot/grub/themes", "/boot/grub2/themes", "/usr/share/grub/themes"]
label = "Theme"
help = "installed theme name (see --list) or theme folder"

[[source.online]]                     # browsed in the GUI (core.online.Ocs)
store = "gnome-look"
category = 109
title = "Gnome-look: GRUB themes"
note = "hundreds of themes with screenshots, each with its own licence"

[[source.links]]
name = "Gorgeous GRUB"
url = "https://github.com/Jacksaur/Gorgeous-GRUB"
note = "a hand-picked list of community GRUB themes, each linking to its page"

[[parts]]
name = "text"
kind = "text"
files = ["*.txt"]
syntax = "hex"
label = "theme.txt"

[[parts]]
name = "icons"
kind = "image"
files = ["icons/*"]

[[parts]]
name = "images"
kind = "image"

[install]
to = ["/boot/grub/themes", "/boot/grub2/themes"]      # the first whose folder exists
sudo = true
help = "copy the result to the themes folder of GRUB (/boot/grub/themes or /boot/grub2/themes)"

[apply]
help = "install, then set GRUB_THEME in /etc/default/grub and write the menu again"
explain = """Here: GRUB_THEME in /etc/default/grub points to the installed theme.txt (a \
backup of the file is made), then the menu is written again (update-grub on Debian and \
Ubuntu, grub-mkconfig -o /boot/grub/grub.cfg, or grub2-mkconfig -o /boot/grub2/grub.cfg \
on Fedora and openSUSE); seen at the next boot."""
set = [{ file = "/etc/default/grub", key = "GRUB_THEME", value = "{installed}/theme.txt" }]
run = [[
    ["update-grub"],                                        # Debian, Ubuntu
    ["grub-mkconfig", "-o", "/boot/grub/grub.cfg"],         # Arch, Gentoo…
    ["grub2-mkconfig", "-o", "/boot/grub2/grub.cfg"],       # Fedora, openSUSE
]]

[restore]
help = "put the previous GRUB_THEME back, write the menu again, remove the installed themes"

[configure]                           # the display settings: --configure (core.settings)
sudo = true
help = "write the display settings given into /etc/default/grub, then write the menu again"
explain = """Here: each setting is a variable of /etc/default/grub (a backup is made, the \
value replaced is remembered), then the menu is written again (update-grub, grub-mkconfig \
or grub2-mkconfig, as for --apply); seen at the next boot."""
run = [[
    ["update-grub"],                                        # Debian, Ubuntu
    ["grub-mkconfig", "-o", "/boot/grub/grub.cfg"],         # Arch, Gentoo…
    ["grub2-mkconfig", "-o", "/boot/grub2/grub.cfg"],       # Fedora, openSUSE
]]
tips = [
    "A theme only shows with the graphical terminal: GRUB_TERMINAL_OUTPUT must not be 'console'.",
    "A menu too small on a large screen: --gfxmode 1920x1080 (or lower), as a theme is drawn at that resolution.",
    "--timeout-style hidden boots at once and shows the menu when Esc (or Shift) is held.",
]

[[configure.settings]]
name = "timeout"
file = "/etc/default/grub"
key = "GRUB_TIMEOUT"
min = -1
max = 3600
help = "seconds before the default entry boots, 0 at once, -1 to wait (not set: 5)"

[[configure.settings]]
name = "timeout-style"
file = "/etc/default/grub"
key = "GRUB_TIMEOUT_STYLE"
choices = ["menu", "countdown", "hidden"]
help = "during the timeout: the menu, a countdown, or nothing until Esc is pressed (not set: menu)"

[[configure.settings]]
name = "gfxmode"
label = "Resolution"
file = "/etc/default/grub"
key = "GRUB_GFXMODE"
pattern = '(auto|\d{3,5}x\d{3,5}(x\d{2})?)(,(auto|\d{3,5}x\d{3,5}(x\d{2})?))*'
what = "WIDTHxHEIGHT[xDEPTH] or auto, several separated by commas"
help = "resolution of the menu: the first of the list the screen supports (not set: auto)"

[[configure.settings]]
name = "gfxpayload"
label = "Linux resolution"
file = "/etc/default/grub"
key = "GRUB_GFXPAYLOAD_LINUX"
pattern = 'keep|text|\d{3,5}x\d{3,5}(x\d{2})?'
what = "keep, text, or WIDTHxHEIGHT[xDEPTH]"
help = "the resolution Linux starts with: keep (the menu's), text, or WxH (not set: chosen by GRUB)"

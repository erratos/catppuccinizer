# Colour mapping for the Plymouth theme 'cyanide' (upstream/plymouth-themes/pack_2/cyanide)
# Edit the targets: any Catppuccin colour name (rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green, teal, sky, sapphire, blue, lavender,
# text, subtext1/0, overlay2/1/0, surface2/1/0, base, mantle, crust) or "accent"
# ("accent" = one theme per accent chosen with -a). You can also add colours.

bar_gap = -45              # -status: px between frame bottom and bar
bar_width = 0.43          # -status: bar width / frame width
# bar = "blue"          # progress bar colour (default: accent or main colour)

[groups.progress]   # progress-0.png, progress-1.png, progress-2.png, ... (24 files)
background = "#000000"
transparent = false

[groups.progress.colors.white]
source = "#ffffff"
target = "text"
share = 0.364   # informative

[groups.progress.colors.cyan]
source = "#3afeff"
target = "sky"
share = 0.636   # informative

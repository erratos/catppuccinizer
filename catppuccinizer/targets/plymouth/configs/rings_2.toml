# Colour mapping for the Plymouth theme 'Rings 2' (upstream/plymouth-themes/pack_4/rings_2)
# Edit the targets: any Catppuccin colour name (rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green, teal, sky, sapphire, blue, lavender,
# text, subtext1/0, overlay2/1/0, surface2/1/0, base, mantle, crust) or "accent"
# ("accent" = one theme per accent chosen with -a). You can also add colours.

bar_gap = -135              # -status: px between frame bottom and bar
bar_width = 0.22          # -status: bar width / frame width
# bar = "blue"          # progress bar colour (default: accent or main colour)

[groups.progress]   # progress-0.png, progress-1.png, progress-2.png, ... (270 files)
background = "#000000"
transparent = false

[groups.progress.colors.blue]
source = "#32bcff"
target = "sapphire"
share = 0.455   # informative

[groups.progress.colors.green]
source = "#8cff4a"
target = "green"
share = 0.322   # informative

[groups.progress.colors.pink]
source = "#ff42a5"
target = "pink"
share = 0.223   # informative

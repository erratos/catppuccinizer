# Colour mapping for the Plymouth theme 'angular' (upstream/plymouth-themes/pack_1/angular)
# Edit the targets: any Catppuccin colour name (rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green, teal, sky, sapphire, blue, lavender,
# text, subtext1/0, overlay2/1/0, surface2/1/0, base, mantle, crust) or "accent"
# ("accent" = one theme per accent chosen with -a). You can also add colours.

bar_gap = -2              # -status: px between frame bottom and bar
bar_width = 0.52          # -status: bar width / frame width
# bar = "blue"          # progress bar colour (default: accent or main colour)

[groups.progress]   # progress-0.png, progress-1.png, progress-2.png, ... (30 files)
background = "#000000"
transparent = false

[groups.progress.colors.blue]
source = "#0129aa"
target = "blue"
share = 0.237   # informative

[groups.progress.colors.orange]
source = "#ff8800"
target = "peach"
share = 0.186   # informative

[groups.progress.colors.blue-2]
source = "#0199c5"
target = "sky"
share = 0.176   # informative

[groups.progress.colors.yellow]
source = "#ffec01"
target = "yellow"
share = 0.118   # informative

[groups.progress.colors.purple]
source = "#2b08ac"
target = "mauve"
share = 0.11   # informative

[groups.progress.colors.pink]
source = "#f00048"
target = "red"
share = 0.111   # informative

[groups.progress.colors.green]
source = "#67bb02"
target = "green"
share = 0.063   # informative

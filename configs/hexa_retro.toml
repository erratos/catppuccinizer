# Colour mapping for the Plymouth theme 'Hexa Retro' (upstream/plymouth-themes/pack_3/hexa_retro)
# Edit the targets: any Catppuccin colour name (rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green, teal, sky, sapphire, blue, lavender,
# text, subtext1/0, overlay2/1/0, surface2/1/0, base, mantle, crust) or "accent"
# ("accent" = one theme per accent chosen with -a). You can also add colours.

bar_gap = 14              # -status: px between frame bottom and bar
bar_width = 0.51          # -status: bar width / frame width
bar = "blue"            # progress bar colour

[groups.progress]   # progress-0.png, progress-1.png, progress-2.png, ... (90 files)
background = "#000000"
transparent = false

[groups.progress.colors.white]
source = "#f6ffef"
target = "text"
share = 0.178   # informative

[groups.progress.colors.red]
source = "#fb4263"
target = "red"
share = 0.328   # informative

[groups.progress.colors.yellow]
source = "#ffb503"
target = "yellow"
share = 0.182   # informative

[groups.progress.colors.cyan]
source = "#63ebde"
target = "teal"
share = 0.167   # informative

[groups.progress.colors.blue]
source = "#44abcc"
target = "blue"
share = 0.146   # informative

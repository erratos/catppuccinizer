# Colour mapping for adi1090x/plymouth-themes pack_3/hexa_retro
# Edit the targets: any Catppuccin colour name (rosewater, flamingo, pink, mauve, red, maroon, peach, yellow, green, teal, sky, sapphire, blue, lavender,
# text, subtext1/0, overlay2/1/0, surface2/1/0, base, mantle, crust) or "accent"
# ("accent" = one theme per accent chosen with -a). You can also add colours.

background = "#000000"   # detected background of the source frames
bar_gap = 14              # -status: px between frame bottom and bar
bar_width = 0.51          # -status: bar width / frame width
bar = "blue"            # -status: bar colour (default: accent or main colour)

[colors.white]
source = "#f6ffef"
target = "text"
share = 0.178   # informative: share of coloured pixels

[colors.red]
source = "#fb4263"
target = "red"
share = 0.328   # informative: share of coloured pixels

[colors.yellow]
source = "#ffb503"
target = "yellow"
share = 0.182   # informative: share of coloured pixels

[colors.cyan]
source = "#63ebde"
target = "teal"
share = 0.167   # informative: share of coloured pixels

[colors.blue]
source = "#44abcc"
target = "blue"
share = 0.146   # informative: share of coloured pixels
